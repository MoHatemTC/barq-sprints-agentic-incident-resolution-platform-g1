[project]
name = "barq-sprints-agentic-incident-resolution-platform-g1"
version = "0.1.0"
description = "Agentic incident resolution platform for ServiceNow"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Imported directly by src/app/retrieval/extraction.py. It arrived only as a
    # markdownify transitive before, so a markdownify change could have broken imports.
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "markdownify>=1.2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    # Tracks the Qdrant SERVER image in docker-compose.yml (qdrant/qdrant:v1.14.0).
    # The two must move together: a newer client against an older server warns
    # "Failed to obtain server version. Unable to check client-server compatibility"
    # and can use request shapes the server does not implement. Dependabot proposed
    # 1.19.0 as #106; the suite passed, because the unit tests use the in-memory
    # client and never reach a real server, so green CI would not have caught the
    # skew. tests/repo/test_qdrant_client_server_pin.py enforces the pairing.
    # To upgrade: bump the compose image and this specifier in the same PR.
    "qdrant-client>=1.14,<1.15",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    # tests/repo/test_path_config_drift.py parses .github/labeler.yml. It only arrived
    # transitively through pre-commit before, so the drift check could break on an
    # unrelated dependency change.
    "pyyaml>=6.0.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/retrieval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["src/app", "src/retrieval"]

[tool.coverage.report]
show_missing = true


[project]
name = "barq-sprints-agentic-incident-resolution-platform-g1"
version = "0.1.0"
description = "Agentic incident resolution platform for ServiceNow"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "markdownify>=1.2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.14,<1.15",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["src/app"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
pythonpath = ["src"]


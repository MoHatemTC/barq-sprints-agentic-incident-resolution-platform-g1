[project]
name = "barq-sprints-agentic-incident-resolution-platform-g1"
version = "0.1.0"
description = "Agentic incident resolution platform for ServiceNow"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    # Imported directly by src/app/retrieval/extraction.py. It arrived only as a
    # markdownify transitive before, so a markdownify change could have broken imports.
    "asyncpg>=0.29.0",
    # Worker execution substrate (S2.3): task queue over the Redis broker.
    "celery[redis]>=5.6,<6",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "markdownify>=1.2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Sync PostgreSQL driver for the Celery worker's session engine (workers/sync_engine.py).
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.14,<1.15",
    # Pinned: redis-py 8.x breaks kombu 5.6 BRPOP parsing (KeyError 'properties' on
    # delivery). Revisit when kombu supports redis-py 8.
    "redis==5.2.1",
    # [asyncio] pulls greenlet, which the async engine needs and which SQLAlchemy only
    # installs implicitly on some CPU architectures (not on Apple Silicon).
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
    # S2.5: the state machine and its tracing. langgraph-sdk caps websockets below 17.
    "langfuse>=4.15,<5",
    "langgraph>=1.2,<2",
    "openai>=2,<3",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    # tests/repo/test_path_config_drift.py parses .github/labeler.yml. It only arrived
    # transitively through pre-commit before, so the drift check could break on an
    # unrelated dependency change.
    "pyyaml>=6.0.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/retrieval", "src/api", "src/agent", "src/observability"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# Integration tests need the docker stack (postgres, redis) which CI and fresh
# clones don't have: deselect by default so `pytest` is green everywhere.
# Run them explicitly with `just test-integration` (passes -m integration,
# which overrides this filter).
addopts = "-m 'not integration'"
markers = [
    "integration: requires live docker services (redis, postgres); deselect with -m 'not integration'",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app", "agent", "observability"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# celery ships without py.typed markers
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/app", "src/retrieval", "src/agent", "src/observability"]

[tool.coverage.report]
show_missing = true


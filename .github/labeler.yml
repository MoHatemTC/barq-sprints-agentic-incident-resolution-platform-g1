# Path-based PR labelling. Matches actions/labeler v5 syntax.
S1.1:
  - changed-files:
      - any-glob-to-any-file:
          - "servicenow/ai_incident_orchestrator/sdk-app/**"
          - "docs/sprint1_field_model.md"
          - "docs/sprint1_acceptance_matrix.md"
          - "docs/sprint1_*verification.md"
          - "docs/sprint1_implementation_runbook.md"
          - "docs/sprint1_submission_checklist.md"

S1.2:
  - changed-files:

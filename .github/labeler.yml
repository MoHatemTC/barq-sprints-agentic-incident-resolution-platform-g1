          - "scripts/verify_permissions.py"
          - "docs/sprint1_audit_and_identity.md"
          - "servicenow/ai_incident_orchestrator/sys_remote_update_set_*.xml"

S1.3:
  - changed-files:
      - any-glob-to-any-file:
          - "servicenow/ai_incident_orchestrator/business_rules/**"
          - "docs/sprint1_event_contract_draft.md"

S1.4:
  - changed-files:
      - any-glob-to-any-file:
          - "docker-compose.yml"
          - "data/**"

S1.5:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/clients/**"
          - "src/app/auth/**"
          - "src/app/models/**"
          - "src/app/exceptions/**"

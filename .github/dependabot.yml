version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # The ServiceNow SDK project has its own npm manifest and lockfile
  # (@servicenow/sdk, @servicenow/glide). Unwatched until now.
  - package-ecosystem: "npm"
    directory: "/servicenow/ai_incident_orchestrator/sdk-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-sdk)"

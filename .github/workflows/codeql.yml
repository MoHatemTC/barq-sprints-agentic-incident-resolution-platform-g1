name: CodeQL

# Advanced setup (a workflow file) rather than default setup, because default
# setup requires repository admin access, which this token does not have.
# Scoped to Python and to hand-written ServiceNow JavaScript. The generated
# Fluent/SDK output under sdk-app/src/fluent/generated/ is excluded as noise,
# but the hand-written server scripts and scaffolds are real logic that runs
# with platform privileges, so they are scanned.

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "servicenow/**"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "servicenow/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GITHUB_TOKEN cannot be granted security-events: write on a pull_request
    # run from a fork, so the upload step in analyze fails there even when
    # the code is fine. Skip that case; push and the weekly schedule still
    # cover forked contributions once merged.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Generated Fluent/SDK output is machine-written and would be noise.
          # The hand-written server scripts and scaffolds are not excluded.
          config: |
            paths-ignore:
              - servicenow/**/sdk-app/src/fluent/generated/**
              - "**/node_modules/**"
              - "**/*.min.js"

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

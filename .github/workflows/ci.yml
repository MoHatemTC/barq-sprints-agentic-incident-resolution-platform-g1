name: CI

# Sprint 1 scope: "a GitHub Actions skeleton running lint and tests on every PR".
# The evaluation gate and image build belong to Sprint 4 (D-09) and are not here yet.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only checks out and runs the quality gate, so it
# needs nothing beyond a read of the repository contents.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      # --locked, not a bare sync: without it uv silently re-resolves and rewrites
      # uv.lock when it disagrees with pyproject.toml, so CI could pass on dependency
      # versions nobody reviewed. With it, a pyproject edit that was not re-locked
      # fails here. See #71.
      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      # No .env exists on a runner. tests/conftest.py injects the required
      # ServiceNow settings so collection cannot depend on local developer state.
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

  # The default pytest addopts deselect `-m integration`, so the job above has
  # never run the queue, webhook-persistence or checkpointer tests against real
  # services: on a developer machine they pass or skip depending on whether
  # Docker happens to be up (#149). This job gives them the services and fails
  # the PR when they break.
  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barq_incident_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      # Hostnames point at the service containers; the fixtures create and
      # migrate their own test databases (barq_s2_1_test) once Postgres answers.
      - name: Integration test
        run: uv run pytest -m integration -q
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: barq_incident_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: "6379"

      # The migration round trip and the approval immutability tests are gated
      # on an explicitly isolated database, and they are not marked
      # "integration", so they need their own run and their own database.
      - name: Create the isolated schema-test database
        run: |
          uv run python - <<'PY'
          import sqlalchemy

          engine = sqlalchemy.create_engine(
              "postgresql+psycopg://postgres:postgres@localhost:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as connection:
              exists = connection.execute(
                  sqlalchemy.text(
                      "SELECT 1 FROM pg_database WHERE datname = 'barq_s2_2_test'"
                  )
              ).scalar()
              if not exists:
                  connection.execute(sqlalchemy.text("CREATE DATABASE barq_s2_2_test"))
          engine.dispose()
          PY

      - name: Migration round trip and approval immutability
        run: uv run pytest tests/db -q
        env:
          BARQ_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/barq_s2_2_test

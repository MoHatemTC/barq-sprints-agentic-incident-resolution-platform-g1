# =============================================================================
# Docker Compose — BARQ AI Incident Resolution Platform
# =============================================================================
# Services:
#   1. qdrant: Vector store for dual dense (384d) + sparse (BM25) KB retrieval
#   2. postgres: Relational store for incident tracking, execution logs, audit
#   3. redis: Fast key-value store and message broker for task queues
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Qdrant — Vector Database (Sprint 1+)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: barq-qdrant
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${BIND_IP:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "$$s = IO::Socket::INET->new(PeerAddr => '127.0.0.1:6333', Timeout => 2); exit($$s ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - barq-network

  # ---------------------------------------------------------------------------
  # PostgreSQL — Relational Database (Sprint 2+)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: barq-postgres
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barq_incident_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barq_incident_dev} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - barq-network

  # ---------------------------------------------------------------------------
  # Redis — Caching & Message Broker (Sprint 2+)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: barq-redis
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # Without this the container never receives REDIS_PASSWORD: the $$ below is escaped
    # so the shell expands it inside the container, where it was always empty. Redis
    # therefore always started unauthenticated while the healthcheck stayed green. (#53)
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
      '
    healthcheck:
      # REDISCLI_AUTH, not -a: the password would otherwise appear in the container's
      # process list on every probe.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - barq-network

  # ---------------------------------------------------------------------------
  # Celery Worker — execution substrate (Sprint 2, Task S2.3)
  # Consumes accepted incident events and runs the processing graph. Listens
  # ONLY on the events queue: the DLQ is a parking lot for humans/replay tooling,
  # never a worker-consumed queue.
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barq-celery-worker
    restart: unless-stopped
    # SIGTERM → warm shutdown finishes the in-flight task; grace period must
    # exceed the worst-case remaining task time (see worker_soft_time_limit).
    stop_grace_period: 30s
    command: >
      celery -A app.workers.celery_app worker
      --queues=${BARQ_EVENTS_QUEUE:-barq:incident:events}
      --concurrency=${WORKER_CONCURRENCY:-4}
      --loglevel=INFO
    env_file:
      - .env
    environment:
      REDIS_HOST: barq-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      POSTGRES_HOST: barq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-barq_incident_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-5}
      WORKER_BACKOFF_BASE: ${WORKER_BACKOFF_BASE:-1.0}
      WORKER_BACKOFF_MAX: ${WORKER_BACKOFF_MAX:-60.0}
      WORKER_BACKOFF_JITTER: ${WORKER_BACKOFF_JITTER:-true}
      WORKER_SOFT_TIME_LIMIT: ${WORKER_SOFT_TIME_LIMIT:-120}
      WORKER_TIME_LIMIT: ${WORKER_TIME_LIMIT:-150}
      WORKER_REPO_BACKEND: ${WORKER_REPO_BACKEND:-postgres}
      WEBHOOK_AUTH_TOKEN: ${WEBHOOK_AUTH_TOKEN:-integration-test-token}
      # S2.5: the graph retrieves from Qdrant on the compose network.
      QDRANT_URL: http://barq-qdrant:6333
      AGENT_GRAPH_BACKEND: ${AGENT_GRAPH_BACKEND:-langgraph}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # Celery responds to `inspect ping` on its own control bus.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - barq-network

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  barq-network:
    name: barq-network
    driver: bridge

# -----------------------------------------------------------------------------
# Named Volumes (Persistent across container lifecycle)
# -----------------------------------------------------------------------------
volumes:
  qdrant_data:
    name: barq_qdrant_data
  postgres_data:
    name: barq_postgres_data
  redis_data:
    name: barq_redis_data
